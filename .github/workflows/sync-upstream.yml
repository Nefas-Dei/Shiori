name: Sync upstream

on:
  schedule:
    # Daily, off the top of the hour to avoid GitHub's cron congestion.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream (tsundoku)
        run: |
          git remote add upstream https://github.com/tsundoku-otaku/tsundoku.git
          git fetch upstream main

      # The "upstream" branch is a live mirror of tsundoku's main, so the
      # latest upstream state is always browsable on this fork.
      - name: Update upstream mirror branch
        run: git push origin upstream/main:refs/heads/upstream --force

      # Merging into main happens automatically ONLY when the merge is
      # conflict-free. On conflicts the merge is aborted and the run fails
      # loudly; resolving is a manual job:
      #   git remote add upstream https://github.com/tsundoku-otaku/tsundoku.git
      #   git fetch upstream main
      #   git checkout main && git merge upstream/main
      # Feature work dev -> main stays a manual pull request.
      - name: Merge into main when conflict-free
        run: |
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            git merge --abort
            echo "::error::Merging tsundoku/main into main produced conflicts. Resolve manually on main: git fetch upstream main && git merge upstream/main."
            exit 1
          fi
